name: timetable_arranger
description: Smart Timetable Arranger mobile app.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12

  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/app_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#080808"
  adaptive_icon_foreground: "assets/app_logo.png"

flutter_native_splash:
  color: "#080808"
  image: assets/app_logo.png

  android: true
  ios: true
  web: true

  android_12:
    color: "#080808"
    image: assets/app_logo.png